notes="<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.0//EN\" \"http://www.w3.org/TR/REC-html40/strict.dtd\">\n<html><head><meta name=\"qrichtext\" content=\"1\" /><meta charset=\"utf-8\" /><style type=\"text/css\">\np, li { white-space: pre-wrap; }\nhr { height: 1px; border-width: 0; }\nli.unchecked::marker { content: \"\\2610\"; }\nli.checked::marker { content: \"\\2612\"; }\n</style></head><body style=\" font-family:'Segoe UI'; font-size:12px; font-weight:400; font-style:normal;\">\n<p style=\" margin-top:12px; margin-bottom:12px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px;\"><a name=\"downloadsummary\"></a>Adds some recipes to help with crafting basic items such as knives, grooming kits, swiss knives, or hammers. Also adds the ability to upgrade mutant hides from hunting. You can now make medical items from mutant loot too.</p>\n<p style=\" margin-top:12px; margin-bottom:12px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px;\">Requires modded DLTX exe and <a href=\"https://www.moddb.com/mods/stalker-anomaly/addons/151-banjajis-crafting-system-improvements\"><span style=\" text-decoration: underline; color:#0078d7;\">Banjaji's Crafting System Improvements 3.0</span></a></p>\n<p style=\" margin-top:12px; margin-bottom:12px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px;\">This addon provides recipes so you can craft more of the basic items using frequently found utility trash loot like durable textiles, scrap metal, and wood. Also provides some alternate recipes for medic related items.</p>\n<p style=\" margin-top:12px; margin-bottom:12px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px;\">Slight buffs were done to several disassemblies</p>\n<p style=\" margin-top:12px; margin-bottom:12px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px;\">Equipment<br />-----------------<br />Grooming Kit<br />Swiss Knife<br />Firestarter Kit<br />Match Boxes<br />Cutlery<br />Scout Knife<br />Hunting Knife<br />Axe</p>\n<p style=\" margin-top:12px; margin-bottom:12px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px;\">Repair <br />-----------------<br />Sewing Thread<br />Ballpeen Hammer<br />Sharpening Stones<br />Steel Wool<br />Small Glucose Shot<br />Large Glucose Shot<br />Vinca<br />Yadulin<br />First Aid Kit</p>\n<p style=\" margin-top:12px; margin-bottom:12px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px;\">New mutant part recipes<br />----------------------------<br />Flesh and boar hides can now be cured and formed into pelt. This can be further upgraded by merging with artifacts.</p>\n<p style=\" margin-top:12px; margin-bottom:12px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px;\">Flesh hide -&gt; Cured Flesh Hide -&gt; Cured Flesh Pelt<br />Board hide -&gt; Cured Boar Hide -&gt; Cured Boar Pelt</p>\n<p style=\" margin-top:12px; margin-bottom:12px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px;\">Both flesh and boar pelts can be combined into a hardened pelt using artifacts. An immense amount of time and effort is required to craft this epic item.</p>\n<p style=\" margin-top:12px; margin-bottom:12px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px;\">Buffed disassemblies<br />----------------------------<br />Cloth Mask<br />Balas<br />Bandanas<br />Old shovel<br />Military Shovel<br />Recipe books, more paper when disassembled</p>\n<p style=\" margin-top:12px; margin-bottom:12px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px;\">- Removed middle man step of needing to empty them before disassembly<br />Gas Balloons<br />Jerry Cans</p>\n<p style=\" margin-top:12px; margin-bottom:12px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px;\">-----------------------------------------------<br />Included Unique NPC Loot in the download since it ties so closely with partial basic toolkits. Goes after HCS</p>\n<p style=\"-qt-paragraph-type:empty; margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px;\"><br /></p>\n<p style=\" margin-top:0px; margin-bottom:0px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px;\">todo: fix lua error spam from equipping scarf</p>\n<p style=\" margin-top:12px; margin-bottom:12px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px;\">------- Changelog ---------<br />0.7d<br />- Added FDDA dltx patch for related zone healing item animations<br />- Changed syringe usage buff to dltx<br />- Added Tactical Tuna and Beard's Tea cooking recipe<br />- Added cooking patch for FCR Campfires (Fillable Canteens and Roasting)<br />- Added potato patch for Outfit Parts Overhaul. This disables the Outfit part crafting component as it was conflicting with Banjaji's crafting.</p>\n<p style=\" margin-top:12px; margin-bottom:12px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px;\">0.7c<br />- Added recipe patch for Placeable Campfire wood.<br />- Added first aid kits to list of items that return syringes.<br />- Multitool no longer needs to be learned through recipe.<br />- Ammo crafting no longer shows duplicate older recipes.</p>\n<p style=\" margin-top:12px; margin-bottom:12px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px;\">0.7b<br />- Fixed Cat thyroid recipe version of Zone First Aid Kits<br />- Rebalanced quantities needed for dog liver and pig eyes.</p>\n<p style=\" margin-top:12px; margin-bottom:12px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px;\">0.7<br />- Uses Banjaji's Crafting System 3.0 now<br />- Can now craft some basic items with no toolkit requirements at a workstation.<br />- basic knife, grooming kits, firestarter kit, matches, ballpeen hammer, knife maintenance, basic zone medicine<br />- Added in Zone Medicine, now you can make bandages and first aid kits from mutant parts. Not as strong as imported.<br />- Added in partial toolkits which are used in a different mod, Unique NPC loot, so that killed technicians drop them.<br />- Buffed ammo crafting, now fixing old ammo is a 1:1 conversion with increased need of ammo parts.</p>\n<p style=\" margin-top:12px; margin-bottom:12px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px;\">- Added patch for ColdSystem 0.6<br />- Added custom scarf item for crafting, keeps u a little bit warmer when equipped in headlamp slot<br />- Yadulin can be used to reduce fever<br /><br />- Added a patch for FDDA (Food Drinks Drugs Animation) addon, version 0.8.8i<br />- New medical items copy animations from the old items they are based on (new bandage copies old bandage and all that)</p>\n<p style=\" margin-top:12px; margin-bottom:12px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px;\">- Currently have a ui bug with learning recipes from books. It won't show the items in the books but you will still learn them and can craft as normal.<br /><br />0.6C<br />- ammo crafting values set to sane values. binoc recipe less extreme.</p>\n<p style=\" margin-top:12px; margin-bottom:12px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px;\">0.6B <br />- Added alternate fuelstove recipes, tweaked binocular recipe since it was stupid</p>\n<p style=\" margin-top:12px; margin-bottom:12px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px;\">0.6<br />- Added the Hunting toolkit. An alternative to the Hunting backpack but without the excessive bulk. Only available thru crafting.<br />- Added patch for Outfit Attachment Overhaul, all it did was changed some recipes for making new attachment in craft.ltx<br />- Added patch for Dynamic Mutants 1.42</p>\n<p style=\" margin-top:12px; margin-bottom:12px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px;\">0.5<br />- Added weapon barrel disassembly for more metal scrap. Pistol barrels disassemble into 1 scrap, shotguns and rifles disassemble into 2 scrap.<br />- Added new Zone Crafting section in workshop for mutant hides<br />- Added new Utility Maintenance section in workshop if you have a basic toolkit. You can now fully repair your knife or multitool using scrap instead of sharpstones.<br />- Added new t2/t3 recipes for the other mutants. Still need to work on new palette swap skins.</p>\n<p style=\" margin-top:12px; margin-bottom:12px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px;\">0.3<br />- Added patch for Bas and Bas + Exoseva<br />- Noticed Hunting Knife recipe referenced itself and slightly reduced requirements for both knives.<br />- Metal Shovel disassembly had a typo</p>\n<p style=\" margin-top:12px; margin-bottom:12px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px;\">todo: Update art assets for new items.</p>\n<p style=\" margin-top:12px; margin-bottom:12px; margin-left:0px; margin-right:0px; -qt-block-indent:0; text-indent:0px;\">-------------------------------------------</p></body></html>"
